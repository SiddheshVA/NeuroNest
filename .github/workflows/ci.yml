name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: the jobs only check out code and upload a test-report artifact.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run still going for the older one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Tests run against an embedded Postgres, and the six repository tests marked
      # @Testcontainers(disabledWithoutDocker = true) use the runner's Docker. They read no secrets:
      # TestDatabaseIsolation (test-only) shuts out .env.properties and real database settings.
      # mvnw is committed without the executable bit, so it is run through sh.
      - name: Run tests
        run: sh mvnw --batch-mode --no-transfer-progress test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # No .nvmrc or engines field in the project: the current Node LTS.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      # No env values needed: the Clerk key and API URL are read when the app runs, not at build time.
      - run: npm run build
