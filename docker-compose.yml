services:
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - WELLNESS_INTERNAL_KEY=my-super-secret-wellness-key-12345
      - WELLNESS_DEV_MODE=0

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - WELLNESS_ML_BASE_URL=http://ml-service:8001
      - WELLNESS_INTERNAL_KEY=my-super-secret-wellness-key-12345
    env_file:
      - ./backend/.env.properties
    depends_on:
      - ml-service
