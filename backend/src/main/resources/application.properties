spring.application.name=backend
# Local secrets (gitignored). Values here fill the ${...} placeholders below.
spring.config.import=optional:file:.env.properties

spring.datasource.url=jdbc:postgresql://ep-sparkling-salad-b393d4q6.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channelBinding=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-3.6-flash

# --- AI Companion LLM providers ---
# auto = Groq first, Gemini as fallback; groq / gemini = use only that provider (for testing).
llm.force-provider=auto
# Groq (OpenAI-compatible API). Key from the GROQ_API_KEY environment variable (or .env.properties).
groq.api.key=${GROQ_API_KEY:}
groq.base-url=https://api.groq.com/openai/v1
# Production multilingual model available to this account (Llama models are not). It is a
# reasoning model: low effort keeps time-to-first-token short; reasoning is never shown.
groq.model=openai/gpt-oss-120b
groq.safety-model=${groq.model}
groq.reasoning-effort=low
# Reasoning tokens count towards these limits. The reply needs room for the header plus 2-4
# paragraphs (~300-400 tokens) on top of reasoning, so keep groq.reply-max-tokens >= 800.
groq.reply-max-tokens=2048
groq.safety-max-tokens=1024
# Reply call only; safety check, summary and memory extraction always use temperature 0.
groq.reply-temperature=0.8
# Gemini limits include its internal "thinking" tokens, hence the larger numbers.
gemini.reply-max-tokens=8192
gemini.safety-max-tokens=4096
# Reply call only. Blank = model default (1.0); Google advises not lowering it for Gemini 3
# models (it can cause looping). Set e.g. 0.8 to match Groq.
gemini.reply-temperature=
# Optional thinkingConfig.thinkingLevel for Gemini (e.g. low); blank = model default.
gemini.thinking-level=
# Timeouts. Fallback to Gemini happens only before the first reply token.
llm.connect-timeout=PT5S
llm.json-timeout=PT20S
llm.first-token-timeout=PT20S
llm.idle-timeout=PT30S
chat.stream.timeout=PT3M
# Context per reply call: last N messages in full; older ones via a rolling summary that is
# updated in the background every N messages that leave the window.
chat.history-window=8
chat.summary.every=8
app.jwt.secret=${JWT_SECRET}
clerk.jwks-url=${CLERK_JWKS_URL:https://gentle-jackal-9234.clerk.accounts.dev/.well-known/jwks.json}
clerk.issuer=${CLERK_ISSUER:https://gentle-jackal-9234.clerk.accounts.dev}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

clerk.jwt-template=neuronest
# Long-term memory (RAG) for the AI Companion. All values have defaults; see MemoryProperties.
memory.enabled=true
memory.embedding-model=gemini-embedding-2
# Fact extraction uses the chat LLM router (Groq first, Gemini fallback); embeddings use Gemini.
memory.recall-min-similarity=0.60
memory.sweep-interval=PT10M
# Keep Boot's default task executor even though memoryExecutor is defined.
spring.task.execution.mode=force

# Knowledge-base RAG over src/main/resources/kb/ (NeuroNest's reviewed wellness library). Embedded into
# kb_chunks in the background at startup; a doc is re-embedded only when its front-matter version
# changes. Crisis-adjacent docs are never ingested; crisis messages never trigger retrieval.
kb.enabled=true
kb.top-k=3
kb.min-similarity=0.60
kb.retrieval-budget=2500ms

# Flyway: existing hand-made schema is baselined as version 1; real migrations start at V2.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
