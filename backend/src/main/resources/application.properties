spring.application.name=backend
# Local secrets (gitignored). Values here fill the ${...} placeholders below. Both paths are optional, so
# the file is found whether the app starts from backend/ (Maven, a terminal) or from the repository root
# (IntelliJ), and a missing file never stops startup. OS environment variables always win over the file.
spring.config.import=optional:file:.env.properties,optional:file:backend/.env.properties

# HTTP port: PORT from the host (most platforms set it), 8080 locally.
server.port=${PORT:8080}

# JDBC URL of the database, e.g. jdbc:postgresql://<host>/<db>?sslmode=require. Required, no default.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-3.6-flash

# --- AI Companion LLM providers ---
# auto = Groq first, Gemini as fallback; groq / gemini = use only that provider (for testing).
llm.force-provider=auto
# Groq (OpenAI-compatible API). Key from the GROQ_API_KEY environment variable (or .env.properties).
groq.api.key=${GROQ_API_KEY:}
groq.base-url=https://api.groq.com/openai/v1
# Production multilingual model available to this account (Llama models are not). It is a
# reasoning model: low effort keeps time-to-first-token short; reasoning is never shown.
groq.model=openai/gpt-oss-120b
groq.safety-model=${groq.model}
groq.reasoning-effort=low
# Reasoning tokens count towards these limits. The reply needs room for the header plus 2-4
# paragraphs (~300-400 tokens) on top of reasoning, so keep groq.reply-max-tokens >= 800.
groq.reply-max-tokens=2048
groq.safety-max-tokens=1024
# Reply call only; safety check, summary and memory extraction always use temperature 0.
groq.reply-temperature=0.8
# Gemini limits include its internal "thinking" tokens, hence the larger numbers.
gemini.reply-max-tokens=8192
gemini.safety-max-tokens=4096
# Reply call only. Blank = model default (1.0); Google advises not lowering it for Gemini 3
# models (it can cause looping). Set e.g. 0.8 to match Groq.
gemini.reply-temperature=
# Optional thinkingConfig.thinkingLevel for Gemini (e.g. low); blank = model default.
gemini.thinking-level=
# Timeouts. Fallback to Gemini happens only before the first reply token.
llm.connect-timeout=PT5S
llm.json-timeout=PT20S
llm.first-token-timeout=PT20S
llm.idle-timeout=PT30S

# --- AI Companion voice ---
# Voice input: the recording is sent to Gemini (gemini.model) for a transcript. Whole call, per attempt.
voice.transcribe-timeout=PT45S
# Spoken replies: Sarvam text-to-speech. Key from SARVAM_API_KEY; without it the app still starts and
# replies are read by the browser's own voice instead.
sarvam.api-key=${SARVAM_API_KEY:}
sarvam.base-url=https://api.sarvam.ai
sarvam.tts-model=bulbul:v4-flash
sarvam.timeout=PT20S
chat.stream.timeout=PT3M
# Context per reply call: last N messages in full; older ones via a rolling summary that is
# updated in the background every N messages that leave the window.
chat.history-window=8
chat.summary.every=8
app.jwt.secret=${JWT_SECRET}
clerk.jwks-url=${CLERK_JWKS_URL}
clerk.issuer=${CLERK_ISSUER}
# Mail (OTP codes and booking notifications). If MAIL_USERNAME or MAIL_PASSWORD is empty, booking emails
# are skipped and the app still starts. MAIL_APP_PASSWORD is the older name for MAIL_PASSWORD.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from-name=${MAIL_FROM_NAME:NeuroNest}
# The web app's address; every link in an email starts with it.
app.base-url=${APP_BASE_URL:http://localhost:5173}
# Web app origins allowed to call /api (comma-separated; patterns like https://*.example.com work).
# Locally any localhost port, since Vite moves to 5174+ when 5173 is taken.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*}

# Notifications. Every enabled channel gets the confirmation and the session reminder; email also gets the
# other booking emails. WhatsApp and SMS are not connected to a provider yet: turning them on only logs
# "skipped" until their send() is written (the placeholders below are for that provider's keys).
notifications.email.enabled=${NOTIFICATIONS_EMAIL_ENABLED:true}
notifications.whatsapp.enabled=${NOTIFICATIONS_WHATSAPP_ENABLED:false}
notifications.sms.enabled=${NOTIFICATIONS_SMS_ENABLED:false}
notifications.whatsapp.api-url=${WHATSAPP_API_URL:}
notifications.whatsapp.api-token=${WHATSAPP_API_TOKEN:}
notifications.whatsapp.sender=${WHATSAPP_SENDER:}
notifications.sms.api-url=${SMS_API_URL:}
notifications.sms.api-key=${SMS_API_KEY:}
notifications.sms.sender-id=${SMS_SENDER_ID:}
# Google Meet spaces for confirmed video sessions (GoogleMeetService, the Meet REST API): an OAuth client and
# a refresh token for the NeuroNest Google account, scope https://www.googleapis.com/auth/meetings.space.created.
# Read from the OS environment. If any is blank the app still starts; video bookings are flagged for a link
# added by hand.
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.refresh-token=${GOOGLE_REFRESH_TOKEN:}
# A session's link works from this many minutes before it starts until it ends (MeetingWindow): the join
# endpoints give it out only then, and MeetingAccessJob opens the space then and closes it afterwards.
google.meet.open-early-minutes=5
google.meet.access-job.enabled=true
# The reminder to both sides before a confirmed meeting starts (SessionReminderJob, every minute).
notifications.reminder.enabled=true
notifications.reminder.minutes-before=10

clerk.jwt-template=neuronest
# Long-term memory (RAG) for the AI Companion. All values have defaults; see MemoryProperties.
memory.enabled=true
memory.embedding-model=gemini-embedding-2
# Fact extraction uses the chat LLM router (Groq first, Gemini fallback); embeddings use Gemini.
memory.recall-min-similarity=0.60
memory.sweep-interval=PT10M
# Keep Boot's default task executor even though memoryExecutor is defined.
spring.task.execution.mode=force

# Knowledge-base RAG over src/main/resources/kb/ (NeuroNest's reviewed wellness library). Embedded into
# kb_chunks in the background at startup; a doc is re-embedded only when its front-matter version
# changes. Crisis-adjacent docs are never ingested; crisis messages never trigger retrieval.
kb.enabled=true
kb.top-k=3
kb.min-similarity=0.60
kb.retrieval-budget=2500ms

# Flyway: existing hand-made schema is baselined as version 1; real migrations start at V2.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Admin dashboard login. Required: startup fails if any is missing or the secret is under 32 characters.
admin.username=${ADMIN_USERNAME:}
admin.password=${ADMIN_PASSWORD:}
admin.jwt-secret=${ADMIN_JWT_SECRET:}

# Professional self-service (/api/pro/**). Both are required: startup fails if either is missing.
# CLERK_SECRET_KEY (sk_...) lets the backend confirm a professional's verified email with Clerk.
clerk.secret-key=${CLERK_SECRET_KEY:}
clerk.api-url=https://api.clerk.com/v1
# Private folder for uploaded verification documents. Never served by the app.
app.storage-dir=${APP_STORAGE_DIR:}
# Uploads: 10 MB per file (voice recordings; documents and photos have their own smaller limits). Parsed lazily so size errors reach the /api/pro error handler; Tomcat
# reads past a too-large body so the client gets the 413 instead of a dropped connection.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.servlet.multipart.resolve-lazily=true
server.tomcat.max-swallow-size=12MB
# Professional profile photos (Cloudinary, free tier). Without all three keys the app still starts and only
# the photo upload answers 503. The secret only signs uploads on the server.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:neuronest/professionals}

# The session grid, the same for every professional (SessionGrid): each session lasts session-minutes and
# is followed by a break-minutes break, so slots start every 75 minutes (7:45, 9:00, 10:15). N consecutive
# sessions are one N x 60-minute meeting; the skipped breaks are blocked after it.
bookings.session-minutes=60
bookings.break-minutes=15

# Booking payments (Razorpay, test mode). Without the key pair the app still starts and only the payment
# endpoints answer 503 "Payments are not configured".
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
# Minutes a new booking holds its slots while the user pays; it becomes CONFIRMED once paid.
bookings.payment-hold-minutes=10
# Last-minute booking: a slot is offered and can be booked if it starts at least booking.min-lead-minutes from
# now (0: any slot that has not started), and never less than booking.min-hold-seconds (a minute to pay).
# The hold above is capped at the slot's start. One rule for the availability and the booking check.
booking.min-lead-minutes=0
booking.min-hold-seconds=60
# Hours to pay for an older request the professional accepted (the old approval flow; no longer used).
bookings.payment-window-hours=24
# Minutes after the hold ends before the hold-release job (every minute, always on) releases the slots, so
# a checkout that is still finishing can complete.
bookings.payment-grace-minutes=2
# Secret set on the Razorpay webhook; without it every delivery is refused. Webhook URL:
# <backend>/api/payments/razorpay/webhook, events payment.captured, order.paid and payment.failed.
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
# NeuroNest's commission on each paid booking, 0 to 100. Stored on each payment when it is paid, so a
# change here only affects later payments.
payments.commission-percent=10

# Background jobs (booking expiry, reminders, expired registrations). Off unless JOBS_ENABLED=true.
jobs.enabled=${JOBS_ENABLED:false}
# Minutes between the end of one run and the start of the next (at least 1).
jobs.interval-minutes=${JOBS_INTERVAL_MINUTES:10}

# One-time rename of older professional documents to readable names: "dry" (report only) or "apply".
# Any other value, or none, turns it off. Remove the setting again after the run.
rename.documents=${RENAME_DOCUMENTS:}
